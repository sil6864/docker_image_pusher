name: Docker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          build-mount-path: '/var/lib/docker/'

      # 关键修复：把 containerd 数据目录也迁到大分区
      # 否则 docker pull 拉下来的 layer 仍写进只剩 ~2GB 的 root 分区
      - name: Redirect containerd root to the large partition
        run: |
          sudo mkdir -p /var/lib/docker/containerd /run/containerd
          sudo mkdir -p /etc/containerd
          if [ -f /etc/containerd/config.toml ] && [ ! -f /etc/containerd/config.toml.bak ]; then
            sudo cp /etc/containerd/config.toml /etc/containerd/config.toml.bak
          fi
          sudo tee /etc/containerd/config.toml > /dev/null <<'EOF'
          version = 2
          root  = "/var/lib/docker/containerd"
          state = "/run/containerd"
          EOF
          sudo systemctl restart containerd
          sudo systemctl restart docker
          echo "----- docker storage info -----"
          docker info | grep -iE 'storage driver|snapshotter' || true

      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Checkout Code
        uses: actions/checkout@v4

      # 注意：原仓库并未使用 docker buildx build，故删除 setup-buildx-action
      # 如未来确实需要 buildx，再重新加回并保留上一步的 containerd 重定向

      - name: Build and push image Aliyun
        shell: bash
        run: |
          set -euo pipefail

          echo "$ALIYUN_REGISTRY_PASSWORD" \
            | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

          declare -A duplicate_images
          declare -A temp_map

          ########################################
          # Pass 1: 检测不同 namespace 下同名镜像
          ########################################
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^[[:space:]]*#'; then
              continue
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
              if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                echo "duplicate image name: $image_name"
                duplicate_images[$image_name]="true"
              fi
            else
              temp_map[$image_name]="$name_space"
            fi
          done < images.txt

          ########################################
          # Pass 2: pull -> retag -> push -> 清理
          ########################################
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^[[:space:]]*#'; then
              continue
            fi

            # 平台前缀（如 linux_arm64_ / linux_arm64_v8_）
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            if [ -z "$platform" ]; then
              platform_prefix=""
            else
              platform_prefix="${platform//\//_}_"
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" && -n "$name_space" ]]; then
              name_space_prefix="${name_space}_"
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${platform_prefix}${name_space_prefix}${image_name_tag}"

            echo "============================================================"
            echo "pull        : $line"
            echo "platform    : ${platform:-<none>}"
            echo "target tag  : $new_image"
            echo "============================================================"

            if ! docker pull $line; then
              echo "::warning::Failed to pull '$line', skip this entry."
              continue
            fi

            echo "docker tag $image -> $new_image"
            docker tag "$image" "$new_image"

            echo "docker push $new_image"
            if ! docker push "$new_image"; then
              echo "::error::Failed to push $new_image"
              docker rmi "$image" "$new_image" || true
              exit 1
            fi

            echo "开始清理磁盘空间"
            df -hT
            docker rmi "$image" "$new_image" || true
            df -hT
          done < images.txt

          echo "所有镜像转存完成"
